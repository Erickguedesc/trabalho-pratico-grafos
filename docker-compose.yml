version: "3.9"

# =============================================================
#
#  ORDEM DE EXECUÇÃO:
#  1. docker compose --profile mine up --build minerador
#  2. docker compose --profile run up --build app
#
# =============================================================

services:

  # -----------------------------------------------------------
  # MINERADOR — coleta dados do GitHub e salva JSON em /dados
  # Roda uma vez e termina (profile: mine)
  # -----------------------------------------------------------
  minerador:
    build:
      context: .
      dockerfile: codigo/mineirador/Dockerfile
    container_name: grafos-minerador
    profiles: ["mine"]
    environment:
      
      GITHUB_TOKENS: ${GITHUB_TOKENS}
      OWNER: ${OWNER}
      REPO: ${REPO}
      OUTPUT_DIR: /dados
    volumes:
      - ./dados:/dados
    networks:
      - grafos-net

  # -----------------------------------------------------------
  # APP — demo CLI + interface Streamlit (profile: run)
  # -----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: codigo/app/Dockerfile
    container_name: grafos-app
    profiles: ["run"]
    ports:
      - "8501:8501"   # Streamlit
    environment:
      INPUT_DIR: /dados
    volumes:
      - ./dados:/dados
    networks:
      - grafos-net

# =============================================================
# REDE interna
# =============================================================
networks:
  grafos-net:
    name: grafos-network
